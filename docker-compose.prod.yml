# Подключается только при деплое: docker compose -f docker-compose.yml -f docker-compose.prod.yml
# Снаружи открыт API. Postgres и RabbitMQ слушают localhost сервера.
services:
  postgres:
    ports: !override
      - "127.0.0.1:5433:5432"

  rabbitmq:
    ports: !override
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
